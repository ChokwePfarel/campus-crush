<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Account · dark + purple</title>

    <!-- Supabase & Tabler Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --bg: #0b0b0b;
          /* deep black */
          --card: #161616;
          --card-border: #2a1e2e;
          --text: #f0eaff;
          --muted: #b8a6c7;
          --danger: #b388ff;
          /* soft purple */
          --danger-dark: #7c4dff;
          --danger-glow: rgba(179, 136, 255, 0.25);
          --input: #1e1a22;
          --border: rgba(179, 136, 255, 0.15);
          --shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
          --radius: 28px;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background-image: radial-gradient(circle at 20% 30%, #1e1028 0%, #0b0b0b 70%);
        }

        .card {
          width: 100%;
          max-width: 460px;
          background: var(--card);
          border: 1px solid var(--card-border);
          border-radius: var(--radius);
          padding: 32px;
          box-shadow: var(--shadow);
          backdrop-filter: blur(2px);
          transition: 0.2s;
        }

        .icon-wrap {
          width: 68px;
          height: 68px;
          margin: 0 auto 20px;
          border-radius: 50%;
          background: rgba(179, 136, 255, 0.15);
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid rgba(179, 136, 255, 0.2);
        }

        .icon-wrap i {
          font-size: 34px;
          color: var(--danger);
          filter: drop-shadow(0 0 6px rgba(179, 136, 255, 0.3));
        }

        h1 {
          text-align: center;
          font-size: 28px;
          font-weight: 600;
          letter-spacing: -0.3px;
          color: #f0eaff;
        }

        .subtitle {
          text-align: center;
          color: var(--muted);
          font-size: 14px;
          line-height: 1.6;
          margin-bottom: 28px;
          opacity: 0.8;
        }

        .warning-box {
          background: rgba(179, 136, 255, 0.06);
          border: 1px solid rgba(179, 136, 255, 0.18);
          border-radius: 20px;
          padding: 18px 20px;
          margin-bottom: 24px;
        }

        .warning-box p {
          font-size: 11px;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.1em;
          margin-bottom: 12px;
          font-weight: 700;
          opacity: 0.7;
        }

        .warning-box ul {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .warning-box li {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 14px;
          color: #ddd0e8;
        }

        .warning-box i {
          color: var(--danger);
          font-size: 18px;
          width: 24px;
          text-align: center;
        }

        .field {
          margin-bottom: 18px;
        }

        .field label {
          display: block;
          margin-bottom: 6px;
          font-size: 14px;
          font-weight: 500;
          color: #cfc0dd;
          letter-spacing: 0.2px;
        }

        .field input {
          width: 100%;
          padding: 15px 18px;
          border-radius: 18px;
          border: 1px solid var(--border);
          background: var(--input);
          color: #f5edff;
          font-size: 15px;
          outline: none;
          transition: 0.2s ease;
        }

        .field input:focus {
          border-color: var(--danger);
          box-shadow: 0 0 0 4px var(--danger-glow);
          background: #1f1a24;
        }

        .field input::placeholder {
          color: #6a5a78;
        }

        /* password show/hide button */
        .field button[type="button"] {
          margin-top: 8px;
          background: transparent;
          border: 1px solid var(--border);
          color: var(--muted);
          padding: 6px 16px;
          border-radius: 40px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          transition: 0.2s;
          letter-spacing: 0.3px;
        }

        .field button[type="button"]:hover {
          background: rgba(179, 136, 255, 0.08);
          border-color: var(--danger);
          color: #d6c4f0;
        }

        .confirm-row {
          display: flex;
          gap: 12px;
          padding: 16px 18px;
          border-radius: 18px;
          background: rgba(179, 136, 255, 0.05);
          margin-top: 6px;
          border: 1px solid rgba(179, 136, 255, 0.08);
        }

        .confirm-row input {
          accent-color: var(--danger);
          width: 18px;
          height: 18px;
          flex-shrink: 0;
          margin-top: 2px;
          cursor: pointer;
        }

        .confirm-row label {
          font-size: 14px;
          line-height: 1.5;
          color: var(--danger);
          font-weight: 450;
          cursor: pointer;
        }

        .btn-delete {
          width: 100%;
          margin-top: 24px;
          border: none;
          border-radius: 20px;
          padding: 16px;
          background: #2a2330;
          color: #6a5a78;
          font-size: 15px;
          font-weight: 600;
          cursor: not-allowed;
          transition: 0.25s ease;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          border: 1px solid transparent;
        }

        .btn-delete.active {
          background: var(--danger);
          color: #0b0b0b;
          cursor: pointer;
          border-color: var(--danger-dark);
          box-shadow: 0 4px 16px rgba(179, 136, 255, 0.3);
        }

        .btn-delete.active:hover {
          background: var(--danger-dark);
          transform: translateY(-2px);
          box-shadow: 0 8px 28px rgba(179, 136, 255, 0.4);
        }

        .btn-delete.active i {
          color: #0b0b0b;
        }

        .status {
          margin-top: 18px;
          padding: 14px 16px;
          border-radius: 18px;
          display: none;
          font-size: 14px;
          line-height: 1.5;
          font-weight: 450;
        }

        .status.error {
          display: block;
          background: rgba(179, 136, 255, 0.12);
          color: #e6d0ff;
          border: 1px solid rgba(179, 136, 255, 0.25);
          backdrop-filter: blur(2px);
        }

        .spinner {
          width: 18px;
          height: 18px;
          border: 2px solid currentColor;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          display: none;
        }

        .spinner.active {
          display: inline-block;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }

        .overlay {
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.7);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 999;
          backdrop-filter: blur(6px);
        }

        .overlay.active {
          display: flex;
        }

        .popup {
          background: var(--card);
          width: 90%;
          max-width: 380px;
          border-radius: var(--radius);
          padding: 32px 28px;
          text-align: center;
          animation: popup 0.3s ease;
          border: 1px solid var(--card-border);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        @keyframes popup {
          from {
            opacity: 0;
            transform: translateY(24px) scale(0.96);
          }
          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }

        .popup-icon {
          width: 80px;
          height: 80px;
          margin: 0 auto 20px;
          border-radius: 50%;
          background: #7c4dff;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 8px 28px rgba(124, 77, 255, 0.3);
        }

        .popup-icon i {
          color: white;
          font-size: 42px;
        }

        .popup h2 {
          margin-bottom: 12px;
          font-size: 24px;
          color: #f0eaff;
        }

        .popup p {
          color: var(--muted);
          line-height: 1.6;
          font-size: 14px;
        }

        .popup button {
          margin-top: 24px;
          width: 100%;
          border: none;
          background: var(--danger);
          color: #0b0b0b;
          padding: 14px;
          border-radius: 40px;
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          transition: 0.2s;
        }

        .popup button:hover {
          background: var(--danger-dark);
          transform: scale(1.01);
          box-shadow: 0 0 20px rgba(179, 136, 255, 0.3);
        }

        @media (max-width: 480px) {
          .card {
            padding: 24px;
            border-radius: 24px;
          }
          h1 {
            font-size: 24px;
          }
        }
    </style>
</head>

<body>

<!-- SUCCESS OVERLAY -->
<div class="overlay" id="successPopup">
    <div class="popup">
        <div class="popup-icon">
            <i class="ti ti-check"></i>
        </div>
        <h2>Account Deleted</h2>
        <p>Your account and associated data have been permanently removed.</p>
        <button onclick="redirectNow()">Continue</button>
    </div>
</div>

<!-- MAIN CARD -->
<div class="card">

    <div class="icon-wrap">
        <i class="ti ti-alert-triangle"></i>
    </div>

    <h1>Delete Account</h1>
    <p class="subtitle">This action is permanent and cannot be undone.</p>

    <div class="warning-box">
        <p>What will be removed</p>
        <ul>
            <li><i class="ti ti-user-x"></i> Account profile</li>
            <li><i class="ti ti-photo-off"></i> Uploaded media</li>
            <li><i class="ti ti-database-off"></i> Associated server data</li>
        </ul>
    </div>

    <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" oninput="toggleBtn()" />
    </div>

    <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" oninput="toggleBtn()" />
        <button type="button" onclick="togglePassword()">Show</button>
    </div>

    <div class="confirm-row">
        <input type="checkbox" id="confirm-check" onchange="toggleBtn()" />
        <label for="confirm-check">I understand this action is irreversible.</label>
    </div>

    <button class="btn-delete" id="delete-btn" onclick="deleteAccount()">
        <i class="ti ti-trash"></i>
        <span id="btn-text">Permanently Delete Account</span>
        <span class="spinner" id="spinner"></span>
    </button>

    <!-- error / status message -->
    <div class="status" id="status-msg"></div>

</div>

<script>

    const SUPABASE_URL =
      'https://wdhzlfqftxytphnohpqb.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHpsZnFmdHh5dHBobm9ocHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NDk4ODQsImV4cCI6MjA4NjIyNTg4NH0.LdCWlMkVaM7FTLLB7mmdf5oQeiTQHB9gP4HaxIUUn1M';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    function toggleBtn() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const checked = document.getElementById('confirm-check').checked;
      const btn = document.getElementById('delete-btn');

      if (email && password && checked) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function showStatus(message, isError = true) {
      const status = document.getElementById('status-msg');
      status.className = 'status error'; // always error style (red/purple)
      status.textContent = message;
      // ensure it's visible
      status.style.display = 'block';
    }

    function clearStatus() {
      const status = document.getElementById('status-msg');
      status.className = 'status';
      status.textContent = '';
      status.style.display = 'none';
    }

    function setLoading(isLoading) {
      const spinner = document.getElementById('spinner');
      const btn = document.getElementById('delete-btn');
      const text = document.getElementById('btn-text');

      if (isLoading) {
        spinner.classList.add('active');
        btn.disabled = true;
        text.textContent = 'Processing...';
        // keep active style but disable pointer
        btn.style.cursor = 'default';
      } else {
        spinner.classList.remove('active');
        btn.disabled = false;
        text.textContent = 'Permanently Delete Account';
        btn.style.cursor = '';
        // re-evaluate active state
        toggleBtn();
      }
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const btn = event.target;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }


    async function deleteAccount() {
      const btn = document.getElementById('delete-btn');
      if (!btn.classList.contains('active')) return;

      // clear previous status
      clearStatus();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      setLoading(true);

      try {
        // 1. Sign in with password
        const { data: authData, error: authError } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (authError) {
          setLoading(false);
          // ----- explicit error message for sign-in failure -----
          showStatus('Sign-in failed: ' + authError.message);
          return;
        }

        // 2. Invoke edge function to delete user
        const { error: deleteError } =
          await supabaseClient.functions.invoke(
            'delete-user', {
              body: { userId: authData.user.id }
            }
          );

        if (deleteError) {
          setLoading(false);
          showStatus('Deletion failed: ' + deleteError.message);
          return;
        }

        // 3. Sign out
        await supabaseClient.auth.signOut();

        setLoading(false);


        document.getElementById('successPopup').classList.add('active');

      } catch (err) {
        setLoading(false);
        showStatus('Something went wrong. Please try again.');
        console.error(err);
      }
    }

    function redirectNow() {
      window.location.href = '/';
    }

    // extra: reset status on input change (optional)
    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        const status = document.getElementById('status-msg');
        if (status.style.display === 'block') {
          status.style.display = 'none';
          status.textContent = '';
        }
      });
    });
</script>
</body>
</html>
