<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deletion Request</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f5f5f3;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1.5rem;
          color: #1a1a1a;
        }

        @media (prefers-color-scheme: dark) {
          body { background: #1c1c1a; color: #e8e8e4; }
          .card { background: #2a2a28; border-color: rgba(255,255,255,0.1); }
          .what-deleted { background: #222220; }
          .what-deleted p { color: #888; }
          .what-deleted li { color: #ccc; }
          .confirm-row { background: rgba(220, 60, 60, 0.12); }
          .field label { color: #999; }
          input { background: #222220; border-color: rgba(255,255,255,0.12); color: #e8e8e4; }
          input::placeholder { color: #555; }
          input:focus { border-color: rgba(255,255,255,0.3); }
          .subtitle { color: #999; }
          .status.error { background: rgba(220,60,60,0.15); color: #f07070; }
          .status.success { background: rgba(40,160,90,0.15); color: #5cd68a; }
        }

        .card {
          background: #ffffff;
          border: 0.5px solid rgba(0,0,0,0.12);
          border-radius: 16px;
          padding: 2rem;
          width: 100%;
          max-width: 420px;
        }

        .icon-wrap {
          width: 52px;
          height: 52px;
          border-radius: 50%;
          background: #fef0f0;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 1.25rem;
        }

        .icon-wrap i {
          font-size: 24px;
          color: #c0392b;
        }

        h1 {
          text-align: center;
          font-size: 18px;
          font-weight: 500;
          margin-bottom: 0.4rem;
        }

        .subtitle {
          text-align: center;
          font-size: 13px;
          color: #666;
          line-height: 1.5;
          margin-bottom: 1.5rem;
        }

        .what-deleted {
          background: #f7f7f5;
          border-radius: 10px;
          padding: 0.75rem 1rem;
          margin-bottom: 1.5rem;
        }

        .what-deleted p {
          font-size: 11px;
          color: #888;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-bottom: 8px;
        }

        .what-deleted ul {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .what-deleted li {
          font-size: 13px;
          color: #333;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .what-deleted li i {
          font-size: 15px;
          color: #c0392b;
        }

        .field {
          margin-bottom: 1rem;
        }

        .field label {
          display: block;
          font-size: 13px;
          color: #555;
          margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"] {
          width: 100%;
          padding: 9px 12px;
          font-size: 14px;
          border: 0.5px solid rgba(0,0,0,0.2);
          border-radius: 8px;
          outline: none;
          transition: border-color 0.15s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
          border-color: rgba(0,0,0,0.4);
          box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .confirm-row {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          background: rgba(220, 60, 60, 0.08);
          border-radius: 10px;
          padding: 0.75rem;
          margin: 1rem 0;
        }

        .confirm-row input[type="checkbox"] {
          width: 16px;
          height: 16px;
          accent-color: #c0392b;
          cursor: pointer;
          flex-shrink: 0;
          margin-top: 1px;
        }

        .confirm-row label {
          font-size: 13px;
          color: #c0392b;
          cursor: pointer;
          line-height: 1.4;
        }

        .btn-delete {
          width: 100%;
          padding: 10px;
          background: rgba(220, 60, 60, 0.08);
          color: #c0392b;
          border: 1px solid rgba(192, 57, 43, 0.35);
          border-radius: 10px;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          transition: opacity 0.15s;
          margin-top: 1rem;
        }

        .btn-delete:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }

        .btn-delete:not(:disabled):hover {
          opacity: 0.8;
        }

        .status {
          display: none;
          text-align: center;
          padding: 0.75rem 1rem;
          border-radius: 10px;
          font-size: 13px;
          margin-top: 1rem;
          line-height: 1.5;
        }

        .status.error {
          display: block;
          background: #fef0f0;
          color: #c0392b;
        }

        .status.success {
          display: block;
          background: #f0faf4;
          color: #1e7e45;
        }

        .spinner {
          display: none;
          width: 15px;
          height: 15px;
          border: 2px solid currentColor;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <i class="ti ti-alert-triangle"></i>
    </div>
    <h1>Delete your account</h1>
    <p class="subtitle">This is permanent and cannot be undone. Please read carefully before proceeding.</p>

    <div class="what-deleted">
        <p>What will be deleted</p>
        <ul>
            <li><i class="ti ti-user-x"></i> Your account and profile</li>
            <li><i class="ti ti-photo-off"></i> All uploaded images</li>
            <li><i class="ti ti-database-off"></i> All associated data from our servers</li>
        </ul>
    </div>

    <div id="form-section">
        <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <div class="confirm-row">
            <input type="checkbox" id="confirm-check" onchange="toggleBtn()" />
            <label for="confirm-check">I understand this action is permanent and irreversible</label>
        </div>

        <button class="btn-delete" id="delete-btn" disabled onclick="deleteAccount()">
            <i class="ti ti-trash"></i>
            <span id="btn-label">Permanently delete my account</span>
            <span class="spinner" id="spinner"></span>
        </button>

        <div class="status" id="status-msg" role="alert"></div>
    </div>
</div>

<script>

    // Vercel replaces these strings at build time
     const SUPABASE_URL = process.env.SUPABASE_URL;
     const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

     const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);

     function toggleBtn() {
       document.getElementById('delete-btn').disabled = !document.getElementById('confirm-check').checked;
     }

     function showStatus(type, msg) {
       const el = document.getElementById('status-msg');
       el.className = 'status ' + type;
       el.textContent = msg;
     }

     async function deleteAccount() {
       const email = document.getElementById('email').value.trim();
       const password = document.getElementById('password').value;
       const btn = document.getElementById('delete-btn');
       const label = document.getElementById('btn-label');
       const spinner = document.getElementById('spinner');

       document.getElementById('status-msg').className = 'status';

       if (!email || !password) {
         showStatus('error', 'Please enter your email and password.');
         return;
       }

       btn.disabled = true;
       label.textContent = 'Deleting…';
       spinner.style.display = 'block';

       try {
         const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
         if (error) throw error;

         const { error: delErr } = await supabaseClient.functions.invoke('delete-user', {
           body: { userId: data.user.id }
         });
         if (delErr) throw delErr;

         document.getElementById('form-section').style.display = 'none';
         showStatus('success', 'Your account has been deleted. You will be redirected shortly.');
         setTimeout(() => window.location.reload(), 3000);
       } catch (err) {
         showStatus('error', err.message || 'Something went wrong. Please try again.');
         btn.disabled = false;
         label.textContent = 'Permanently delete my account';
         spinner.style.display = 'none';
       }
     }
</script>
</body>
</html>
