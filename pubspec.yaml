name: dating_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  flutter_bloc: ^9.1.1
  supabase: any
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  feather_icons: ^1.2.0
  lucide_icons: ^0.257.0
  google_mobile_ads: ^7.0.0
  hugeicons: ^1.1.6
  mocktail: ^1.0.5
  shared_preferences: any
  shimmer_animation: ^2.2.2+1
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon.png

flutter:
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-VariableFont_wght.ttf
    - family: CalSans
      fonts:
        - asset: assets/fonts/CalSans-Regular.ttf

  uses-material-design: true
  assets:
    - .env
    - assets/
